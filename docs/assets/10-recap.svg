      <text x="147" y="60" fill="#FFFFFF" font-size="28" font-weight="700" text-anchor="middle">Agir</text>
      <text x="147" y="140" font-size="23" text-anchor="middle">act_energy</text>
      <text x="147" y="185" font-size="21" text-anchor="middle">Surveiller et &#234;tre pr&#233;venu.</text>
